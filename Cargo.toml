[package]
name = "microtak-admin-web"
version = "0.3.0"
edition = "2021"
description = "Web-based admin UI for a MicroTAK server: enrollment invite tokens (with QR codes) and mission role management"
license = "AGPL-3.0-or-later"

[lib]
name = "microtak_admin_web"
path = "src/lib.rs"

[[bin]]
name = "microtak-admin-web"
path = "src/main.rs"

[dependencies]
axum = "0.7"
maud = { version = "0.26", features = ["axum"] }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# Only for the end-to-end test, which drives a real microtak-server App the
# same way microtak-server's own tests/e2e.rs does -- microtak-admin-web
# itself has no compile-time dependency on microtak-server at runtime, it
# only ever talks to it over HTTP (see README.md).
microtak-server = { path = "../microtak-server" }
rcgen = "0.14"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
